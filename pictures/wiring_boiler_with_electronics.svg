<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>PV-Boiler wiring for boilers with built-in electronics</title>
  <rect width="760" height="500" fill="#ffffff"/>
  <text x="20" y="24" font-size="15" font-weight="bold" fill="#222">Wiring for boilers with built-in electronics (recommended power option)</text>

  <!-- Boiler -->
  <rect x="20" y="40" width="380" height="370" rx="8" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="30" y="58" font-weight="bold" fill="#222">Boiler</text>

  <!-- L input, directly to the cut wire -->
  <circle cx="50" cy="100" r="5" fill="#8a5a2b"/>
  <text x="30" y="86" fill="#222" font-weight="bold">L (boiler input)</text>
  <polyline points="50,100 220,100 220,66 440,66 440,90 470,90" fill="none" stroke="#8a5a2b" stroke-width="3"/>

  <!-- L supply to boiler electronics -->
  <circle cx="110" cy="100" r="4" fill="#8a5a2b"/>
  <polyline points="110,100 110,288 230,288" fill="none" stroke="#8a5a2b" stroke-width="2"/>

  <!-- Removed original wire section -->
  <polyline points="220,100 300,100 300,130" fill="none" stroke="#999" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="262" y="92" text-anchor="middle" fill="#666">&#x2702; cut</text>

  <!-- Heater side wire to TRIAC-L -->
  <polyline points="300,160 300,130 470,130" fill="none" stroke="#d9480f" stroke-width="3"/>

  <!-- Heating element -->
  <polyline points="300,160 300,168 288,174 312,186 288,198 312,210 288,222 300,228 300,240" fill="none" stroke="#222" stroke-width="2"/>
  <text x="270" y="204" text-anchor="end" fill="#222">Heating element</text>

  <!-- Boiler electronics + safety thermostat (one block, untouched) -->
  <line x1="300" y1="240" x2="300" y2="256" stroke="#1c6dd0" stroke-width="3"/>
  <rect x="230" y="256" width="140" height="64" rx="4" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="300" y="276" text-anchor="middle" font-size="12" fill="#222">Boiler electronics</text>
  <text x="300" y="292" text-anchor="middle" font-size="12" fill="#222">+ safety thermostat</text>
  <text x="300" y="309" text-anchor="middle" font-size="11" fill="#666">(untouched)</text>
  <line x1="300" y1="320" x2="300" y2="350" stroke="#1c6dd0" stroke-width="3"/>

  <!-- N -->
  <polyline points="300,350 50,350" fill="none" stroke="#1c6dd0" stroke-width="3"/>
  <circle cx="50" cy="350" r="5" fill="#1c6dd0"/>
  <text x="30" y="372" fill="#222" font-weight="bold">N (boiler input)</text>
  <circle cx="300" cy="350" r="4" fill="#1c6dd0"/>
  <polyline points="300,350 470,350" fill="none" stroke="#1c6dd0" stroke-width="3"/>

  <!-- Controller -->
  <rect x="470" y="70" width="270" height="315" rx="8" fill="#f6f6f6" stroke="#222" stroke-width="2"/>
  <text x="605" y="376" text-anchor="middle" font-weight="bold" fill="#222">PV-Boiler controller</text>

  <circle cx="470" cy="90" r="5" fill="#8a5a2b"/>
  <text x="485" y="84" font-weight="bold" fill="#222">MAINS-L</text>
  <circle cx="470" cy="130" r="5" fill="#d9480f"/>
  <text x="485" y="124" font-weight="bold" fill="#222">TRIAC-L</text>
  <circle cx="470" cy="350" r="5" fill="#1c6dd0"/>
  <text x="485" y="344" font-weight="bold" fill="#222">MAINS-N</text>

  <!-- Inside controller: triac -->
  <polyline points="470,90 640,90 640,100" fill="none" stroke="#8a5a2b" stroke-width="3"/>
  <rect x="610" y="100" width="60" height="22" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="640" y="116" text-anchor="middle" fill="#222">triac</text>
  <polyline points="640,122 640,130 470,130" fill="none" stroke="#d9480f" stroke-width="3"/>

  <!-- Inside controller: supply + ESP -->
  <circle cx="570" cy="90" r="4" fill="#8a5a2b"/>
  <line x1="570" y1="90" x2="570" y2="200" stroke="#8a5a2b" stroke-width="2"/>
  <line x1="470" y1="350" x2="570" y2="350" stroke="#1c6dd0" stroke-width="3"/>
  <circle cx="570" cy="350" r="4" fill="#1c6dd0"/>
  <line x1="570" y1="350" x2="570" y2="290" stroke="#1c6dd0" stroke-width="2"/>
  <rect x="500" y="200" width="220" height="90" rx="6" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <text x="610" y="240" text-anchor="middle" fill="#222">Supply + ESP</text>
  <text x="610" y="258" text-anchor="middle" fill="#222">(galvanically isolated)</text>

  <!-- Legend -->
  <line x1="30" y1="428" x2="60" y2="428" stroke="#8a5a2b" stroke-width="3"/>
  <text x="70" y="432" fill="#222">L from the boiler's L input (boiler side of the cut wire) &#x2192; MAINS-L</text>
  <line x1="30" y1="448" x2="60" y2="448" stroke="#d9480f" stroke-width="3"/>
  <text x="70" y="452" fill="#222">Switched L, heater side of the cut wire &#x2192; TRIAC-L</text>
  <line x1="30" y1="468" x2="60" y2="468" stroke="#1c6dd0" stroke-width="3"/>
  <text x="70" y="472" fill="#222">N from the boiler (where the electronics/thermostat-side element wire returns) &#x2192; MAINS-N</text>
  <text x="20" y="492" font-size="11" fill="#666">Disconnect from the mains before working. The boiler-side end is connected directly to the boiler's L input, so it is permanently live.</text>
</svg>
