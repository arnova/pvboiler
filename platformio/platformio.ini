; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Uploading:
;   First flash (USB serial): pio run -e usb -t upload
;   Later updates (OTA):      pio run -e ota -t upload

[platformio]
default_envs = usb

; Settings shared by the usb and ota environments
[env]
platform = espressif8266
board = nodemcuv2
#platform = espressif32
#board = esp32dev
framework = arduino
build_flags = -Wall
monitor_speed = 115200
lib_deps =
  knolleary/PubSubClient@^2.8
  elapsedMillis@^1.0.6
  arduinoJson@^7.4.3
  olikraus/U8g2@^2.36.18
  paulstoffregen/OneWire @ ^2.3.8
  milesburton/DallasTemperature @ ^3.11.0

; USB serial upload (esptool is the default upload protocol)
[env:usb]
#upload_port = COM5

; Over-the-air upload. Use the controller's IP address instead of
; pvboiler.local if mDNS is not available in your network.
[env:ota]
upload_protocol = espota
upload_port = pvboiler.local